<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LexDigital</title>

  <!-- PWA -->
  <meta name="theme-color" content="#0f2f49" />
  <link rel="manifest" href="./manifest.json?v=38" />
  <link rel="apple-touch-icon" href="./assets/profile_512.png?v=38" />

  <!-- Estilos -->
  <link rel="stylesheet" href="./styles/base.css?v=38" />
  <link rel="stylesheet" href="./styles/components.css?v=38" />
</head>

<body>
  <div id="app"></div>

  <!-- App -->
  <script type="module" src="./src/main.js?v=38"></script>

  <!-- Registrar Service Worker con scope en /LexDigital/ -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js?v=38', { scope: './' })
          .catch(console.error);
      });
    }
  </script>
</body>

</html>
