<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LexDigital</title>

  <!-- PWA -->
  <meta name="theme-color" content="#0f2f49" />
  <link rel="manifest" href="manifest.json?v=36" />

  <!-- Estilos (cache-busting) -->
  <link rel="stylesheet" href="styles/base.css?v=36" />
  <link rel="stylesheet" href="styles/components.css?v=36" />
</head>
<body>
  <div id="app"></div>

  <!-- App -->
  <script type="module" src="src/main.js?v=36"></script>

  <!-- Registrar Service Worker con scope relativo a /LexDigital/ -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js?v=36').catch(console.error);
      });
    }
  </script>
</body>
</html>
